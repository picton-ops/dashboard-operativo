<html lang="es">
<head>

  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body,#root{width:100vw;height:100vh;overflow:hidden;background:#dce6f0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:22px;color:#0f172a}

    /* ── Barra superior fija ── */
    .top-bar{position:fixed;top:0;left:0;right:0;height:90px;
      background:linear-gradient(180deg,#074080 0%,#042D59 100%);
      border-bottom:3px solid #f59e0b;
      display:flex;align-items:center;padding:0 18px;gap:0;z-index:200}

    /* ── Grid principal ── */
    .cross-grid{display:grid;width:100vw;height:calc(100vh - 90px);margin-top:90px;
      grid-template-columns:calc(var(--left-pct,50)*1%) 8px calc((100 - var(--left-pct,50))*1% - 8px);
      grid-template-rows:calc(var(--top-pct,50)*1%) 8px calc((100 - var(--top-pct,50))*1% - 8px);
      user-select:none}
    .q-tl{grid-column:1;grid-row:1;overflow:hidden;background:#fff;box-shadow:1px 1px 4px rgba(4,45,89,.1)}
    .q-tr{grid-column:3;grid-row:1;overflow:hidden;background:#fff;box-shadow:-1px 1px 4px rgba(4,45,89,.1)}
    .q-bl{grid-column:1;grid-row:3;overflow:hidden;background:#fff;box-shadow:1px -1px 4px rgba(4,45,89,.1)}
    .q-br{grid-column:3;grid-row:3;overflow:hidden;background:#fff;box-shadow:-1px -1px 4px rgba(4,45,89,.1)}

    /* ── Divisores cruz ── */
    .v-handle{grid-column:2;grid-row:1/4;background:linear-gradient(180deg,#021730 0%,#042D59 40%,#063c74 50%,#042D59 60%,#021730 100%);cursor:col-resize;z-index:5;position:relative}
    .v-handle:hover{background:linear-gradient(180deg,#042D59 0%,#0a4a8f 50%,#042D59 100%)}
    .h-handle{grid-column:1/4;grid-row:2;background:linear-gradient(90deg,#021730 0%,#042D59 40%,#063c74 50%,#042D59 60%,#021730 100%);cursor:row-resize;z-index:5;position:relative}
    .h-handle:hover{background:linear-gradient(90deg,#042D59 0%,#0a4a8f 50%,#042D59 100%)}
    .cross-center{grid-column:2;grid-row:2;background:radial-gradient(circle,#fbbf24 0%,#f59e0b 60%,#d97706 100%);border-radius:50%;cursor:grab;z-index:10;position:relative;display:flex;align-items:center;justify-content:center;transition:transform .1s;box-shadow:0 0 0 2px #fff,0 0 0 4px rgba(245,158,11,.5)}
    .cross-center:hover{transform:scale(1.25);box-shadow:0 0 0 2px #fff,0 0 0 5px rgba(245,158,11,.7)}
    .cross-center:active{cursor:grabbing}

    /* ── Divisor interno ── */
    .tiger-divider{height:22px;flex-shrink:0;user-select:none;
      background:#eef3fa;border-top:1px solid #b8cfe4;border-bottom:1px solid #b8cfe4;
      display:flex;align-items:center;justify-content:center;
      font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#5a84a8}

    /* ── Cabecera de panel ── */
    .panel-header{
      background:linear-gradient(180deg,#074080 0%,#042D59 100%);
      border-bottom:3px solid #f59e0b;
      padding:9px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;min-height:44px}
    .panel-title{font-size:1rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#fff}

    /* ── Tablas ── */
    .op-table{width:100%;border-collapse:collapse;font-size:1rem;table-layout:fixed}
    .op-table th{
      background:linear-gradient(180deg,#f5f9ff 0%,#edf3fb 100%);
      color:#042D59;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:11px;
      padding:5px 8px;text-align:left;
      border-bottom:2px solid #042D59;border-right:1px solid #d8e5f3;
      white-space:nowrap;position:sticky;top:0;z-index:1}
    .op-table th:last-child{border-right:none}
    .op-table td{padding:5px 8px;border-bottom:1px solid #ecf2fb;color:#0f172a;font-weight:500;vertical-align:middle}
    .op-table tbody tr{transition:background .12s}
    .op-table tbody tr:hover td{background:#dbeafe}
    .op-table tbody tr:hover td:first-child{border-left:3px solid #042D59;padding-left:7px}
    .op-table input[type=text],.op-table select{background:#fff;border:1px solid #c8d8ec;border-radius:5px;color:#0f172a;padding:4px 8px;font-size:1rem;width:100%;outline:none;transition:border-color .1s,box-shadow .1s}
    .op-table input[type=text]:focus,.op-table select:focus{border-color:#042D59;box-shadow:0 0 0 3px rgba(4,45,89,.12)}

    /* ── Botones ── */
    .btn-icon{background:transparent;border:none;cursor:pointer;padding:3px 6px;border-radius:4px;color:rgba(255,255,255,.8);display:inline-flex;align-items:center;transition:all .1s;font-size:1rem;line-height:1}
    .btn-icon:hover{color:#fff;background:rgba(255,255,255,.2)}
    .op-table .btn-icon,.modal-card .btn-icon{color:#94a3b8}
    .op-table .btn-icon:hover,.modal-card .btn-icon:hover{color:#dc2626;background:#fee2e2}
    .btn-primary{background:linear-gradient(180deg,#0a4a8f 0%,#042D59 100%);color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:1rem;font-weight:600;cursor:pointer;box-shadow:0 2px 6px rgba(4,45,89,.3)}
    .btn-primary:hover{background:linear-gradient(180deg,#1258a8 0%,#0a4a8f 100%)}
    .btn-danger{background:linear-gradient(180deg,#ef4444 0%,#dc2626 100%);color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:1rem;font-weight:600;cursor:pointer;box-shadow:0 2px 6px rgba(220,38,38,.3)}
    .btn-danger:hover{background:linear-gradient(180deg,#f87171 0%,#ef4444 100%)}
    .btn-ghost{background:#fff;color:#475569;border:1px solid #c8d8ec;border-radius:6px;padding:6px 12px;font-size:1rem;cursor:pointer;transition:all .1s}
    .btn-ghost:hover{color:#042D59;border-color:#042D59;background:#f0f5fb}

    /* ── Modal ── */
    .modal-overlay{position:fixed;inset:0;background:rgba(2,18,40,.6);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px)}
    .modal-card{background:#fff;border:1px solid #dde6f0;border-radius:14px;padding:24px;min-width:350px;max-width:580px;width:90vw;max-height:82vh;display:flex;flex-direction:column;gap:14px;
      box-shadow:0 0 0 1px rgba(4,45,89,.06),0 30px 80px rgba(4,45,89,.25)}
    .modal-title{font-size:1.1rem;font-weight:800;color:#042D59;letter-spacing:.03em}

    /* ── Date Picker ── */
    .dp-btn{background:#fff;border:1px solid #c8d8ec;border-radius:5px;color:#1e293b;padding:4px 8px;font-size:1rem;cursor:pointer;width:100%;text-align:left;white-space:nowrap;transition:border-color .1s,box-shadow .1s}
    .dp-btn:hover{border-color:#042D59;box-shadow:0 0 0 2px rgba(4,45,89,.1)}
    .dp-popup{position:absolute;top:calc(100% + 4px);left:0;z-index:50;background:#fff;border:1px solid #c8d8ec;border-radius:10px;padding:12px;box-shadow:0 12px 40px rgba(4,45,89,.18);min-width:230px}
    .dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
    .dp-dow{text-align:center;font-size:.78rem;font-weight:700;color:#64748b;padding:3px 0;text-transform:uppercase}
    .dp-day{text-align:center;font-size:.88rem;padding:5px 2px;border-radius:5px;cursor:pointer;color:#475569;border:none;background:transparent;width:100%;transition:background .1s}
    .dp-day:hover{background:#e8eff8;color:#042D59}
    .dp-day.today{color:#0a4a8f;font-weight:800}
    .dp-day.selected{background:#042D59;color:#fff;font-weight:700}

    /* ── Misc ── */
    .op-cb{width:17px;height:17px;accent-color:#042D59;cursor:pointer}
    .modal-ta{background:#f8fafc;border:1px solid #c8d8ec;border-radius:6px;color:#1e293b;padding:10px;font-size:1rem;resize:vertical;outline:none;font-family:inherit;width:100%}
    .modal-ta:focus{border-color:#042D59;box-shadow:0 0 0 3px rgba(4,45,89,.1)}
    ::-webkit-scrollbar{width:5px;height:5px}
    ::-webkit-scrollbar-track{background:#e8eff8}
    ::-webkit-scrollbar-thumb{background:#a8c0d6;border-radius:3px}
    ::-webkit-scrollbar-thumb:hover{background:#6b8fad}
  </style>
</head>
<body>
  <!-- Mensaje de error CDN — visible sólo si falla algún script externo -->
  <div id="cdn-error" style="display:none;position:fixed;inset:0;background:#fff3cd;
    align-items:center;justify-content:center;flex-direction:column;gap:14px;
    font-family:'Segoe UI',sans-serif;z-index:9999;padding:24px;text-align:center">
    <div style="font-size:2rem">⚠️</div>
    <div style="font-size:1.1rem;font-weight:700;color:#7c5700">No se pudo cargar el dashboard</div>
    <div style="color:#555;max-width:420px;line-height:1.6">
      Uno de los servicios externos (CDN) no respondió.<br>
      Esto es temporal — suele resolverse en minutos.
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
      <button onclick="location.reload()" style="background:#042D59;color:#fff;border:none;
        border-radius:6px;padding:10px 22px;font-size:1rem;cursor:pointer;font-family:inherit">
        🔄 Reintentar
      </button>
      <button onclick="location.reload(true)" style="background:#fff;color:#042D59;
        border:1px solid #042D59;border-radius:6px;padding:10px 22px;font-size:1rem;
        cursor:pointer;font-family:inherit">
        🗑 Limpiar caché y reintentar
      </button>
    </div>
    <div style="color:#888;font-size:.8rem;margin-top:4px">
      Si el problema persiste, contacta al administrador.
    </div>
  </div>

  <div id="root">
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;
      font-family:'Segoe UI',sans-serif;color:#475569;font-size:1rem;gap:10px">
      <span style="font-size:1.4rem">⏳</span> Cargando dashboard...
    </div>
  </div>
  <script type="text/babel">
    const {useState,useEffect,useRef,useReducer,useContext,createContext} = React;

    // ══════════════════════════════════════════════════════════════════════
    // CONFIGURACIÓN FIREBASE — pegar aquí el config de tu proyecto Firebase
    // ══════════════════════════════════════════════════════════════════════
    const FIREBASE_CONFIG = {
      apiKey:            "AIzaSyDmt9Nv6cX2eMYWznVQKb67_pmbAhENI_o",
      authDomain:        "dashboard-operativo-414d8.firebaseapp.com",
      databaseURL:       "https://dashboard-operativo-414d8-default-rtdb.firebaseio.com",
      projectId:         "dashboard-operativo-414d8",
      storageBucket:     "dashboard-operativo-414d8.firebasestorage.app",
      messagingSenderId: "723463361749",
      appId:             "1:723463361749:web:056acaa0ac223adf7ebe5c"
    };
    firebase.initializeApp(FIREBASE_CONFIG);
    const DB = firebase.database().ref('dashboard-operativo');
    // ══════════════════════════════════════════════════════════════════════

    // ── Utilidades ─────────────────────────────────────────────────────────
    function uuid(){
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
        const r=Math.random()*16|0; return(c==='x'?r:(r&0x3|0x8)).toString(16);
      });
    }
    function todayISO(){
      const d=new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }
    function fmtDate(iso){
      if(!iso)return'—';
      const[y,m,d]=iso.split('-');return`${d}/${m}/${y}`;
    }
    function daysAgo(iso){
      const a=new Date();a.setHours(0,0,0,0);
      const b=new Date(iso+'T00:00:00');b.setHours(0,0,0,0);
      return Math.round((a-b)/86400000);
    }
    const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    const DOW=['Lu','Ma','Mi','Ju','Vi','Sá','Do'];
    function diasMes(y,m){return new Date(y,m+1,0).getDate();}
    function primerDOW(y,m){const d=new Date(y,m,1).getDay();return d===0?6:d-1;}
    function isHoy(y,m,d){const t=new Date();return t.getFullYear()===y&&t.getMonth()===m&&t.getDate()===d;}
    function isoPartes(y,m,d){return`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
    function daysUntil(iso){
      if(!iso)return null;
      const hoy=new Date();hoy.setHours(0,0,0,0);
      const d=new Date(iso+'T00:00:00');d.setHours(0,0,0,0);
      return Math.round((d-hoy)/86400000);
    }

    // ── Feriados y cálculo automático de Plazo Máximo ─────────────────────
    function toISO(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
    function easterSunday(y){
      const a=y%19,b=Math.floor(y/100),c=y%100,dd=Math.floor(b/4),e=b%4;
      const f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3);
      const h=(19*a+b-dd-g+15)%30,i=Math.floor(c/4),k=c%4;
      const l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);
      const mo=Math.floor((h+l-7*m+114)/31)-1,dy=((h+l-7*m+114)%31)+1;
      return new Date(y,mo,dy);
    }
    function nthWkd(y,mo,dow,n){
      let d=new Date(y,mo,1),cnt=0;
      while(true){if(d.getDay()===dow&&++cnt===n)break;d.setDate(d.getDate()+1);}
      return toISO(d);
    }
    function lastWkd(y,mo,dow){
      let d=new Date(y,mo+1,0);
      while(d.getDay()!==dow)d.setDate(d.getDate()-1);
      return toISO(d);
    }
    function ferCL(y){
      const s=new Set();
      [[0,1],[4,1],[4,21],[5,29],[6,16],[7,15],[8,18],[8,19],[9,12],[10,1],[11,8],[11,25]].forEach(
        ([m,d])=>s.add(`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`));
      if(y>=2021)s.add(`${y}-06-21`); // Día Nacional de los Pueblos Indígenas
      const e=easterSunday(y);
      const gf=new Date(e);gf.setDate(e.getDate()-2); // Viernes Santo
      const hs=new Date(e);hs.setDate(e.getDate()-1); // Sábado Santo
      s.add(toISO(gf));s.add(toISO(hs));
      return s;
    }
    function ferUS(y){
      const s=new Set();
      [[0,1],[5,19],[6,4],[10,11],[11,25]].forEach(
        ([m,d])=>s.add(`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`));
      s.add(nthWkd(y,0,1,3));   // MLK Day (3er lunes enero)
      s.add(nthWkd(y,1,1,3));   // Presidents' Day (3er lunes feb)
      s.add(lastWkd(y,4,1));    // Memorial Day (último lunes mayo)
      s.add(nthWkd(y,8,1,1));   // Labor Day (1er lunes sep)
      s.add(nthWkd(y,9,1,2));   // Columbus Day (2do lunes oct)
      s.add(nthWkd(y,10,4,4));  // Thanksgiving (4to jueves nov)
      return s;
    }
    // Suma n días hábiles (L-V) hacia adelante, saltando hols
    function addHabil(iso,n,hols){
      let d=new Date(iso+'T00:00:00'),cnt=0;
      while(cnt<n){
        d.setDate(d.getDate()+1);
        const dow=d.getDay(),s=toISO(d);
        if(dow!==0&&dow!==6&&!hols.has(s))cnt++;
      }
      return toISO(d);
    }
    // Resta n días hábiles hacia atrás; inclSat=true => sábado cuenta como hábil
    function subHabil(iso,n,hols,inclSat){
      let d=new Date(iso+'T00:00:00'),cnt=0;
      while(cnt<n){
        d.setDate(d.getDate()-1);
        const dow=d.getDay(),s=toISO(d);
        if(dow===0||hols.has(s)||(!inclSat&&dow===6))continue;
        cnt++;
      }
      return toISO(d);
    }
    function calcPlazoMaximo(fechaDineroISO){
      if(!fechaDineroISO)return null;
      const y=parseInt(fechaDineroISO.slice(0,4));
      const cl=new Set([...ferCL(y),...ferCL(y+1)]);
      const us=new Set([...ferUS(y),...ferUS(y+1)]);
      // Paso 1: +10 días hábiles desde distribución recibida (feriados CL)
      let fpago=addHabil(fechaDineroISO,10,cl);
      // Paso 2: si fecha pago cae en feriado USA, avanzar al siguiente hábil CL+USA
      {
        let d=new Date(fpago+'T00:00:00');
        while(us.has(toISO(d))){
          do{d.setDate(d.getDate()+1);}while(d.getDay()===0||d.getDay()===6||cl.has(toISO(d)));
        }
        fpago=toISO(d);
      }
      // Paso 3: -5 días hábiles (incluyendo sábado), feriados CL
      let plazo=subHabil(fpago,5,cl,true);
      // Paso 4: si cae viernes → jueves; si ese jueves es feriado CL → un día atrás
      {
        let d=new Date(plazo+'T00:00:00');
        if(d.getDay()===5){
          d.setDate(d.getDate()-1);
          if(cl.has(toISO(d)))d.setDate(d.getDate()-1);
        }
        plazo=toISO(d);
      }
      return plazo;
    }
    // Plazo máximo suscripción: capital call − 2 días hábiles CL = fecha suscripción,
    // luego − 5 días hábiles CL más = plazo máximo (total 7 días hábiles antes del capital call)
    function calcPlazoMaximoSusc(fechaCapitalCallISO){
      if(!fechaCapitalCallISO)return null;
      const y=parseInt(fechaCapitalCallISO.slice(0,4));
      const cl=new Set([...ferCL(y-1),...ferCL(y),...ferCL(y+1)]);
      const fechaSusc=subHabil(fechaCapitalCallISO,2,cl,false);
      return subHabil(fechaSusc,5,cl,false);
    }

    function rowAlert(iso){
      const d=daysUntil(iso);
      if(d===null)return{};
      if(d<=0)return{background:'#fee2e2'};  // vencido o hoy → rojo suave
      if(d<=7)return{background:'#fef9c3'};  // ≤7 días → amarillo
      if(d<=30)return{background:'#dcfce7'}; // ≤30 días → verde suave
      return{};
    }
    function badgeAlert(iso,overdueLabel='VENCIDO'){
      const d=daysUntil(iso);
      if(d===null)return null;
      const pill={borderRadius:5,padding:'2px 8px',fontSize:'.7rem',fontWeight:800,color:'#fff',marginLeft:7,display:'inline-block',lineHeight:1.5,verticalAlign:'middle',letterSpacing:'.03em'};
      if(d<0)return<span style={{...pill,background:'#dc2626'}}>{overdueLabel}</span>;
      if(d===0)return<span style={{...pill,background:'#dc2626'}}>HOY</span>;
      if(d<=7)return<span style={{...pill,background:'#d97706'}}>{d}d</span>;
      if(d<=30)return<span style={{...pill,background:'#16a34a'}}>{d}d</span>;
      return null;
    }
    function badgePago(iso){
      const d=daysUntil(iso);
      if(d===null)return null;
      const pill={borderRadius:5,padding:'2px 8px',fontSize:'.7rem',fontWeight:800,color:'#fff',marginLeft:7,display:'inline-block',lineHeight:1.5,verticalAlign:'middle',letterSpacing:'.03em'};
      if(d<0)return<span style={{...pill,background:'#dc2626'}}>PENDIENTE</span>;
      if(d===0)return<span style={{...pill,background:'#dc2626'}}>HOY</span>;
      if(d<=7)return<span style={{...pill,background:'#d97706'}}>{d}d</span>;
      if(d<=30)return<span style={{...pill,background:'#16a34a'}}>{d}d</span>;
      return null;
    }

    // ── Ordenamiento ──────────────────────────────────────────────────────
    function sortRows(rows,key,dir){
      if(!key)return rows;
      return[...rows].sort((a,b)=>{
        const va=a[key]??''; const vb=b[key]??'';
        if(va===''&&vb!=='')return 1;
        if(va!==''&&vb==='')return -1;
        if(va===''&&vb==='')return 0;
        const cmp=va<vb?-1:va>vb?1:0;
        return dir==='asc'?cmp:-cmp;
      });
    }
    // Anchos de columna por defecto (deben sumar 100 por tabla)
    const COL_DEF={
      tp:[44,24,22,10],
      sp:[34,21,21,14,10],
      se:[20,18,18,17,13,14],
      dp:[36,22,22,12,8],
      de:[22,30,18,16,8,6],
    };

    // Hook: redimensionar columnas (sincronizado con Firebase)
    function useColWidths(tableKey){
      const{state,dispatch}=useStore();
      const tableRef=useRef(null);
      const latestCW=useRef(state.layout?.colWidths||{});
      useEffect(()=>{latestCW.current=state.layout?.colWidths||{};},[state.layout?.colWidths]);
      const widths=state.layout?.colWidths?.[tableKey]||COL_DEF[tableKey];
      function startResize(colIdx,e){
        e.preventDefault();e.stopPropagation();
        const el=tableRef.current;if(!el)return;
        const startX=e.clientX;
        const tw=el.offsetWidth;
        const sw=[...widths];
        function mv(ev){
          const dx=ev.clientX-startX;
          const dp=(dx/tw)*100;
          const nw=[...sw];
          nw[colIdx]=Math.max(4,sw[colIdx]+dp);
          if(colIdx+1<nw.length)nw[colIdx+1]=Math.max(4,sw[colIdx+1]-dp);
          const ths=el.querySelectorAll('thead th');
          nw.forEach((w,i)=>{if(ths[i])ths[i].style.width=w+'%';});
        }
        function up(){
          window.removeEventListener('mousemove',mv);window.removeEventListener('mouseup',up);
          const ths=el.querySelectorAll('thead th');
          const fw=Array.from(ths).map(th=>parseFloat(th.style.width)||10);
          dispatch({type:'UPD_LAYOUT',v:{colWidths:{...latestCW.current,[tableKey]:fw}}});
        }
        window.addEventListener('mousemove',mv);window.addEventListener('mouseup',up);
      }
      return{tableRef,widths,startResize};
    }

    // Hook: ordenamiento sincronizado con Firebase
    function useTableSort(tableKey){
      const{state,dispatch}=useStore();
      const latestSort=useRef(state.layout?.sort||{});
      useEffect(()=>{latestSort.current=state.layout?.sort||{};},[state.layout?.sort]);
      const sort=state.layout?.sort?.[tableKey]||{key:null,dir:'asc'};
      function toggleSort(k){
        const ns=sort.key===k?{...sort,dir:sort.dir==='asc'?'desc':'asc'}:{key:k,dir:'asc'};
        dispatch({type:'UPD_LAYOUT',v:{sort:{...latestSort.current,[tableKey]:ns}}});
      }
      return{sort,toggleSort};
    }

    // Columna unificada: sort + resize handle (recibe todo por props)
    function ColTh({label,field,sort,onSort,width,colIdx,startResize,last}){
      const active=field&&sort&&sort.key===field;
      return(
        <th style={{width:width+'%',cursor:field?'pointer':'default',
          userSelect:'none',position:'relative',overflow:'hidden'}}
          onClick={field&&onSort?()=>onSort(field):undefined}
          onMouseEnter={field?e=>e.currentTarget.style.background='#e2ecf8':undefined}
          onMouseLeave={field?e=>e.currentTarget.style.background='':undefined}>
          <span style={{display:'inline-flex',alignItems:'center',gap:5,paddingRight:last?0:10}}>
            {label}
            {field&&sort&&<span style={{fontSize:'.62rem',lineHeight:1,
              opacity:active?1:.2,color:active?'#042D59':'inherit',fontWeight:active?900:400}}>
              {active?(sort.dir==='asc'?'▲':'▼'):'⇅'}
            </span>}
          </span>
          {!last&&<div onMouseDown={e=>{e.stopPropagation();startResize(colIdx,e);}}
            style={{position:'absolute',right:0,top:0,bottom:0,width:6,
              cursor:'col-resize',zIndex:3,background:'transparent',borderRight:'2px solid transparent'}}
            onMouseEnter={e=>e.currentTarget.style.borderRight='2px solid rgba(4,45,89,.5)'}
            onMouseLeave={e=>e.currentTarget.style.borderRight='2px solid transparent'}
          />}
        </th>
      );
    }

    // ── Reducer ────────────────────────────────────────────────────────────
    function reducer(s,a){
      switch(a.type){
        case'ADD_ENC':return{...s,encargados:[...s.encargados,{id:uuid(),name:a.name}]};
        case'DEL_ENC':return{...s,encargados:s.encargados.filter(e=>e.id!==a.id)};
        case'ADD_TAREA':return{...s,tareas:[...s.tareas,{id:uuid(),...a.p}]};
        case'UPD_TAREA':return{...s,tareas:s.tareas.map(t=>t.id===a.p.id?a.p:t)};
        case'DEL_TAREA':return{...s,tareas:s.tareas.filter(t=>t.id!==a.id)};
        case'INCIDENCIA':{
          const fecha=a.fecha||todayISO();
          const from=new Date(s.incidenciaResetDate+'T00:00:00');
          const to=new Date(fecha+'T00:00:00');
          const cnt=Math.round((to-from)/86400000);
          return{...s,incidenciaResetDate:fecha,incidencias:[{id:uuid(),fecha,motivo:a.motivo,contadorAlReset:cnt},...s.incidencias]};
        }
        case'UPD_INCIDENCIA':{
          const updated=s.incidencias.map(i=>i.id===a.id?{...i,fecha:a.fecha,motivo:a.motivo}:i);
          const maxFecha=updated.reduce((mx,i)=>i.fecha>mx?i.fecha:mx,'0000-00-00');
          return{...s,incidencias:updated,incidenciaResetDate:maxFecha||s.incidenciaResetDate};
        }
        case'ADD_SP':return{...s,suscripcionesPendientes:[...s.suscripcionesPendientes,{id:uuid(),...a.p}]};
        case'UPD_SP':return{...s,suscripcionesPendientes:s.suscripcionesPendientes.map(x=>x.id===a.p.id?a.p:x)};
        case'DEL_SP':return{...s,suscripcionesPendientes:s.suscripcionesPendientes.filter(x=>x.id!==a.id)};
        case'PROMO_S':{
          const r=s.suscripcionesPendientes.find(x=>x.id===a.id);if(!r)return s;
          return{...s,suscripcionesPendientes:s.suscripcionesPendientes.filter(x=>x.id!==a.id),
            suscripcionesEnCurso:[...s.suscripcionesEnCurso,{id:uuid(),fondo:r.eventoPendiente,fechaSuscripcion:null,fechaCapitalCall:r.fechaCapitalCall,encargadoId:null}]};
        }
        case'ADD_SE':return{...s,suscripcionesEnCurso:[...s.suscripcionesEnCurso,{id:uuid(),...a.p}]};
        case'UPD_SE':return{...s,suscripcionesEnCurso:s.suscripcionesEnCurso.map(x=>x.id===a.p.id?a.p:x)};
        case'DEL_SE':return{...s,suscripcionesEnCurso:s.suscripcionesEnCurso.filter(x=>x.id!==a.id)};
        case'DONE_S':{
          const r=s.suscripcionesEnCurso.find(x=>x.id===a.id);if(!r)return s;
          return{...s,suscripcionesEnCurso:s.suscripcionesEnCurso.filter(x=>x.id!==a.id),
            suscripcionesHistory:[{id:uuid(),timestamp:new Date().toISOString(),desc:`Suscripción: ${r.fondo}`,data:r},...s.suscripcionesHistory]};
        }
        case'ADD_DP':return{...s,distribucionesPendientes:[...s.distribucionesPendientes,{id:uuid(),...a.p}]};
        case'UPD_DP':return{...s,distribucionesPendientes:s.distribucionesPendientes.map(x=>x.id===a.p.id?a.p:x)};
        case'DEL_DP':return{...s,distribucionesPendientes:s.distribucionesPendientes.filter(x=>x.id!==a.id)};
        case'PROMO_D':{
          const r=s.distribucionesPendientes.find(x=>x.id===a.id);if(!r)return s;
          return{...s,distribucionesPendientes:s.distribucionesPendientes.filter(x=>x.id!==a.id),
            distribucionesEnCurso:[...s.distribucionesEnCurso,{id:uuid(),fondo:r.fondo,tipoEvento:null,fechaDinero:r.fechaDinero}]};
        }
        case'ADD_DE':return{...s,distribucionesEnCurso:[...s.distribucionesEnCurso,{id:uuid(),...a.p}]};
        case'UPD_DE':return{...s,distribucionesEnCurso:s.distribucionesEnCurso.map(x=>x.id===a.p.id?a.p:x)};
        case'DEL_DE':return{...s,distribucionesEnCurso:s.distribucionesEnCurso.filter(x=>x.id!==a.id)};
        case'DONE_D':{
          const r=s.distribucionesEnCurso.find(x=>x.id===a.id);if(!r)return s;
          return{...s,distribucionesEnCurso:s.distribucionesEnCurso.filter(x=>x.id!==a.id),
            distribucionesHistory:[{id:uuid(),timestamp:new Date().toISOString(),desc:`Distribución: ${r.fondo}`,data:r},...s.distribucionesHistory]};
        }
        case'ADD_FONDO':{const n=a.nombre.trim();if(!n||(s.fondos||[]).includes(n))return s;return{...s,fondos:[...(s.fondos||[]),n]};}
        case'DEL_FONDO':return{...s,fondos:(s.fondos||[]).filter(f=>f!==a.nombre)};
        case'SET_AUTO_ENC':return{...s,autoEncargados:{...(s.autoEncargados||{}),[a.id]:a.encargadoId}};
        case'DISMISS_AUTO':return{...s,autoDismissed:[...(s.autoDismissed||[]),a.id]};
        case'UPD_NOTA':return{...s,notasDetalles:{...(s.notasDetalles||{}),[a.side]:a.texto}};
        case'UPD_LAYOUT':return{...s,layout:{...(s.layout||INIT.layout),...a.v}};
        default:return s;
      }
    }

    // ── Store con Firebase ─────────────────────────────────────────────────
    // Firebase elimina arrays y los convierte a objetos {0:...,1:...}.
    // Esta función los restaura a arrays normales al leer.
    function toArr(v){if(!v)return[];if(Array.isArray(v))return v;return Object.values(v);}
    function normalizeState(data){
      if(!data)return INIT;
      return{
        ...INIT,...data,
        encargados:             toArr(data.encargados),
        tareas:                 toArr(data.tareas),
        incidencias:            toArr(data.incidencias),
        suscripcionesPendientes:toArr(data.suscripcionesPendientes),
        suscripcionesEnCurso:   toArr(data.suscripcionesEnCurso),
        suscripcionesHistory:   toArr(data.suscripcionesHistory),
        distribucionesPendientes:toArr(data.distribucionesPendientes),
        distribucionesEnCurso:  toArr(data.distribucionesEnCurso),
        distribucionesHistory:  toArr(data.distribucionesHistory),
        autoEncargados:         data.autoEncargados||{},
        autoDismissed:          toArr(data.autoDismissed),
        fondos:                 data.fondos!=null?toArr(data.fondos):FONDOS_INIT,
        notasDetalles:          data.notasDetalles||{left:'',right:''},
        layout:{
          ...INIT.layout,...(data.layout||{}),
          colWidths:{...INIT.layout.colWidths,...(data.layout?.colWidths||{})},
          sort:{...INIT.layout.sort,...(data.layout?.sort||{})},
        },
      };
    }

    const Ctx=createContext(null);
    function StoreProvider({children}){
      const[state,setState]=useState(null);

      useEffect(()=>{
        // Escucha cambios en tiempo real — se activa cuando cualquier usuario cambia algo
        DB.on('value',snap=>{
          setState(normalizeState(snap.val()));
        });
        return()=>DB.off();
      },[]);

      function dispatch(action){
        setState(prev=>{
          if(!prev)return prev;
          const next=reducer(prev,action);
          DB.set(next); // escribe en Firebase → llega a todos los usuarios
          return next;  // actualización local inmediata (no espera a Firebase)
        });
      }

      if(!state)return(
        <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'100vh',gap:12}}>
          <div style={{fontSize:'1.5rem'}}>⏳</div>
          <div style={{color:'#475569',fontSize:'.95rem'}}>Conectando al dashboard compartido...</div>
        </div>
      );

      return <Ctx.Provider value={{state,dispatch}}>{children}</Ctx.Provider>;
    }
    function useStore(){return useContext(Ctx);}

    const AuthCtx=createContext(null);
    function useAuth(){return useContext(AuthCtx);}

    // ── DatePicker ─────────────────────────────────────────────────────────
    function DatePicker({value,onChange,ph='Seleccionar',maxDate=null}){
      const hoy=new Date();
      const ini=value?new Date(value+'T00:00:00'):hoy;
      const[yr,setYr]=useState(ini.getFullYear());
      const[mo,setMo]=useState(ini.getMonth());
      const[open,setOpen]=useState(false);
      const[pos,setPos]=useState({top:0,left:0,openUp:false});
      const ref=useRef(null);
      const btnRef=useRef(null);
      useEffect(()=>{
        if(!open)return;
        const fn=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};
        document.addEventListener('mousedown',fn);
        return()=>document.removeEventListener('mousedown',fn);
      },[open]);
      function handleOpen(){
        if(btnRef.current){
          const r=btnRef.current.getBoundingClientRect();
          const popupH=270,popupW=240;
          const spaceBelow=window.innerHeight-r.bottom;
          const openUp=spaceBelow<popupH&&r.top>popupH;
          setPos({
            top: openUp?r.top-popupH-4:r.bottom+4,
            left: Math.min(r.left,window.innerWidth-popupW-8),
            openUp
          });
        }
        setOpen(o=>!o);
      }
      function prev(){if(mo===0){setYr(y=>y-1);setMo(11);}else setMo(m=>m-1);}
      function next(){
        if(maxDate){
          const md=new Date(maxDate+'T00:00:00');
          if(yr>md.getFullYear()||(yr===md.getFullYear()&&mo>=md.getMonth()))return;
        }
        if(mo===11){setYr(y=>y+1);setMo(0);}else setMo(m=>m+1);
      }
      const canNext=!maxDate||(()=>{const md=new Date(maxDate+'T00:00:00');return yr<md.getFullYear()||(yr===md.getFullYear()&&mo<md.getMonth());})();
      const dias=diasMes(yr,mo),off=primerDOW(yr,mo);
      const cells=[];
      for(let i=0;i<off;i++)cells.push(null);
      for(let d=1;d<=dias;d++)cells.push(d);
      return(
        <div ref={ref} style={{position:'relative',width:'100%'}}>
          <button ref={btnRef} type="button" className="dp-btn" style={!value?{color:'#475569'}:undefined} onClick={handleOpen}>
            📅 {value?fmtDate(value):ph}
          </button>
          {open&&(
            <div className="dp-popup" style={{position:'fixed',top:pos.top,left:pos.left,zIndex:9999}} onMouseDown={e=>e.stopPropagation()}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6}}>
                <button type="button" className="btn-icon" onClick={prev}>‹</button>
                <span style={{fontSize:'.875rem',fontWeight:600,color:'#1e293b',textTransform:'capitalize'}}>{MESES[mo]} {yr}</span>
                <button type="button" className="btn-icon" onClick={next} disabled={!canNext} style={{opacity:canNext?1:.3,cursor:canNext?'pointer':'default'}}>›</button>
              </div>
              <div className="dp-grid">
                {DOW.map(d=><span key={d} className="dp-dow">{d}</span>)}
                {cells.map((day,i)=>{
                  if(day===null)return<span key={'e'+i}/>;
                  const iso=isoPartes(yr,mo,day);
                  const afterMax=maxDate&&iso>maxDate;
                  return(
                    <button key={day} type="button" disabled={afterMax}
                      className={'dp-day'+(isHoy(yr,mo,day)?' today':'')+(value===iso?' selected':'')}
                      style={afterMax?{color:'#cbd5e1',cursor:'default'}:undefined}
                      onClick={()=>{if(!afterMax){onChange(iso);setOpen(false);}}}>
                      {day}
                    </button>
                  );
                })}
              </div>
              {value&&<button type="button" className="btn-ghost" style={{width:'100%',marginTop:6,fontSize:'.8rem'}} onClick={()=>{onChange(null);setOpen(false);}}>Limpiar fecha</button>}
            </div>
          )}
        </div>
      );
    }

    // ── Modal ──────────────────────────────────────────────────────────────
    function Modal({isOpen,onClose,title,children,wide}){
      useEffect(()=>{
        const fn=e=>{if(e.key==='Escape')onClose();};
        if(isOpen)window.addEventListener('keydown',fn);
        return()=>window.removeEventListener('keydown',fn);
      },[isOpen,onClose]);
      if(!isOpen)return null;
      return(
        <div className="modal-overlay" onMouseDown={onClose}>
          <div className="modal-card" style={wide?{maxWidth:700,width:'95vw'}:undefined} onMouseDown={e=>e.stopPropagation()}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <span className="modal-title">{title}</span>
              <button type="button" className="btn-icon" onClick={onClose}>✕</button>
            </div>
            {children}
          </div>
        </div>
      );
    }

    // ── Incident Modal ─────────────────────────────────────────────────────
    function IncidentModal({isOpen,onClose,cnt}){
      const{dispatch}=useStore();
      const[mot,setMot]=useState('');
      const[fecha,setFecha]=useState(todayISO());
      function confirm(){
        if(!mot.trim()||!fecha)return;
        dispatch({type:'INCIDENCIA',motivo:mot.trim(),fecha});
        setMot('');setFecha(todayISO());onClose();
      }
      function handleClose(){setMot('');setFecha(todayISO());onClose();}
      const hoyISO=todayISO();
      const diasDesdeUltima=fecha?(()=>{
        const d=daysUntil(fecha);

            <label style={{color:'#64748b',fontSize:'.75rem',fontWeight:600,letterSpacing:'.06em',textTransform:'uppercase'}}>Motivo</label>

            <button type="button" className="btn-ghost" onClick={handleClose}>Cancelar</button>

          </div>
        </Modal>
      );
    }

    // ── Contador Día de Pago (penúltimo día hábil del mes) ────────────────
    function PagoDiaCounter(){
      const MESES_CORTO=['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
      function penultimoDiaHabil(y,m){
        const cl=ferCL(y);
        const us=ferUS(y);
        let d=new Date(y,m+1,0);d.setHours(0,0,0,0);
        let count=0;
        while(true){
          const dow=d.getDay();
          const iso=toISO(d);
          if(dow!==0&&dow!==6&&!cl.has(iso)&&!us.has(iso)){count++;if(count===2)return new Date(d);}
          d.setDate(d.getDate()-1);
        }
      }
      const hoy=new Date();hoy.setHours(0,0,0,0);
      let target=penultimoDiaHabil(hoy.getFullYear(),hoy.getMonth());
      if(hoy>target){
        let ny=hoy.getFullYear(),nm=hoy.getMonth()+1;
        if(nm>11){nm=0;ny++;}
        target=penultimoDiaHabil(ny,nm);
      }
      const iso=`${target.getFullYear()}-${String(target.getMonth()+1).padStart(2,'0')}-${String(target.getDate()).padStart(2,'0')}`;
      const d=daysUntil(iso);
      const esHoy=d===0;
      const numColor=esHoy?'#1B5E20':d<=3?'#dc2626':d<=7?'#d97706':'#1B5E20';
      return(
        <div style={{display:'flex',alignItems:'stretch',borderRadius:10,overflow:'hidden',
          boxShadow:'0 2px 12px rgba(160,112,0,.28)',border:'2px solid rgba(160,112,0,.25)',flexShrink:0}}>
          <div style={{background:'linear-gradient(180deg,#2e7d32 0%,#1B5E20 100%)',
            padding:'6px 13px',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:2}}>
            <span style={{fontSize:'22px',lineHeight:1}}>💰</span>
            <span style={{color:'rgba(255,255,255,.85)',fontSize:'12px',fontWeight:700,letterSpacing:'.1em',textTransform:'uppercase'}}>PAGO</span>
          </div>
          <div style={{background:'#fffdf0',padding:'6px 16px',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
            <span style={{fontSize:'13px',fontWeight:800,color:'#1B5E20',textTransform:'uppercase',letterSpacing:'.14em',lineHeight:1}}>
              {esHoy?'¡Hoy se paga!':'Día de pago'}
            </span>
            <div style={{display:'flex',alignItems:'baseline',gap:4,marginTop:2}}>
              <span style={{fontSize:'2.2rem',fontWeight:900,color:numColor,lineHeight:1}}>
                {esHoy?'💸':d}
              </span>
              {!esHoy&&<span style={{fontSize:'14px',color:'#78909c',fontWeight:600}}>días</span>}
            </div>
          </div>
          <div style={{background:'linear-gradient(180deg,#C8A217 0%,#9A7A0A 100%)',
            padding:'6px 13px',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:2}}>
            <span style={{color:'#fff',fontSize:'18px',fontWeight:900,lineHeight:1,textShadow:'0 1px 3px rgba(0,0,0,.35)'}}>{target.getDate()}</span>
            <span style={{color:'rgba(255,255,255,.9)',fontSize:'13px',fontWeight:700,letterSpacing:'.1em'}}>{MESES_CORTO[target.getMonth()]}</span>
          </div>
        </div>
      );
    }

                    <tr key={row.id} onClick={()=>!isE&&setEd({...row})} style={{cursor:isE?'default':'pointer',...(isE?{}:rowAlert(row.fechaDinero))}}>
                      <td>{isE?<FondoSelect value={ed.fondo} onChange={v=>setEd(p=>({...p,fondo:v}))}/>:row.fondo||<span style={{color:'#94a3b8',fontStyle:'italic'}}>—</span>}</td>
                      <td>{isE
                        ?<select value={ed.tipoEvento??''} onChange={e=>setEd(p=>({...p,tipoEvento:e.target.value||null}))}
                            style={{background:'#fff',border:'1px solid #c8d8ec',borderRadius:4,color:'#1e293b',padding:'3px 6px',fontSize:'1rem',width:'100%'}}>
                            <option value="">— Seleccionar —</option>
                            {TIPOS.map(t=><option key={t} value={t}>{t}</option>)}
                          </select>
                        :<span style={{color:row.tipoEvento?'#1e293b':'#94a3b8'}}>{row.tipoEvento??'—'}</span>}
                      </td>
                      <td>{isE?<DatePicker value={ed.fechaDinero} onChange={v=>setEd(p=>({...p,fechaDinero:v}))}/>:<span>{fmtDate(row.fechaDinero)}{badgePago(row.fechaDinero)}</span>}</td>
                      <td>{isE?<EncSelect value={ed.encargadoId} onChange={v=>setEd(p=>({...p,encargadoId:v}))}/>:encNm(row.encargadoId)}</td>
                      <td style={{textAlign:'center'}}>{!isE&&<input type="checkbox" className="op-cb" checked={false} onChange={()=>dispatch({type:'DONE_D',id:row.id})} onClick={e=>e.stopPropagation()} title="Completar"/>}</td>
                      <td><div style={{display:'flex',gap:2}}>
                        {isE?(<><button type="button" className="btn-icon" style={{color:'#16a34a'}} onClick={save}>✓</button><button type="button" className="btn-icon" onClick={()=>setEd(null)}>✕</button></>)
                          :<button type="button" className="btn-icon" style={{color:'#dc2626'}} onClick={e=>{e.stopPropagation();dispatch({type:'DEL_DE',id:row.id});if(ed?.id===row.id)setEd(null);}}>🗑</button>}
                      </div></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          <GenericHistModal isOpen={showH} onClose={()=>setShowH(false)} title="Historial Distribuciones" entries={state.distribucionesHistory}
            cols={[
              {k:'fondo',l:'Fondo'},
              {k:'tipoEvento',l:'Tipo evento',r:v=>v??'—'},
              {k:'fechaDinero',l:'Fecha $',r:v=>fmtDate(v)},
            ]}
          />
        </div>
      );
    }


    // ── Cross Layout ───────────────────────────────────────────────────────
    function CrossLayout({tl,tr,bl,br}){
      const{state,dispatch}=useStore();
      const ref=useRef(null);
      const drag=useRef(null);

      // Aplica layout guardado en Firebase (también cuando otro usuario lo cambia)
      useEffect(()=>{
        if(drag.current)return; // no interrumpir drag activo
        const el=ref.current;if(!el)return;
        const{leftPct=50,topPct=50}=state.layout||{};
        el.style.setProperty('--left-pct',leftPct);
        el.style.setProperty('--top-pct',topPct);
      },[state.layout?.leftPct,state.layout?.topPct]);

      function startDrag(axis){
        return e=>{
          e.preventDefault();drag.current=axis;
          function mv(ev){
            const el=ref.current;if(!el)return;
            const r=el.getBoundingClientRect();
            if(drag.current==='v'||drag.current==='c')
              el.style.setProperty('--left-pct',Math.max(15,Math.min(85,((ev.clientX-r.left)/r.width)*100)));
            if(drag.current==='h'||drag.current==='c')
              el.style.setProperty('--top-pct',Math.max(15,Math.min(85,((ev.clientY-r.top)/r.height)*100)));
          }
          function up(){
            const el=ref.current;
            const leftPct=parseFloat(el?.style.getPropertyValue('--left-pct')||50);
            const topPct=parseFloat(el?.style.getPropertyValue('--top-pct')||50);
            drag.current=null;
            window.removeEventListener('mousemove',mv);
            window.removeEventListener('mouseup',up);
            dispatch({type:'UPD_LAYOUT',v:{leftPct,topPct}});
          }
          window.addEventListener('mousemove',mv);window.addEventListener('mouseup',up);
        };
      }
      return(
        <div ref={ref} className="cross-grid">
          <div className="v-handle" onMouseDown={startDrag('v')}/>
          <div className="h-handle" onMouseDown={startDrag('h')}/>
          <div className="cross-center" onMouseDown={startDrag('c')}/>
          <div className="q-tl">{tl}</div>
          <div className="q-tr">{tr}</div>
          <div className="q-bl">{bl}</div>
          <div className="q-br">{br}</div>
        </div>
      );
    }

    // ── App ────────────────────────────────────────────────────────────────
    function App(){
      return(
        <>
          <CountersBar/>
          <CrossLayout
            tl={<SuscripcionTable/>}
            tr={<EnCursoSusc/>}
            bl={<DistribucionTable/>}
            br={<EnCursoDist/>}
          />
        </>
      );
    }

    // ── Login ──────────────────────────────────────────────────────────────
    function LoginScreen(){
      const[email,setEmail]=useState('');
      const[pass,setPass]=useState('');
      const[err,setErr]=useState('');
      const[loading,setLoading]=useState(false);
      async function doLogin(e){
        e.preventDefault();
        if(!email||!pass)return;
        setLoading(true);setErr('');
        try{
          await firebase.auth().signInWithEmailAndPassword(email,pass);
        }catch(ex){
          setErr(ex.code==='auth/user-not-found'||ex.code==='auth/wrong-password'||ex.code==='auth/invalid-credential'
            ?'Correo o contraseña incorrectos.'
            :'Error al ingresar. Intenta nuevamente.');
          setLoading(false);
        }
      }
      return(
        <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'100vh',background:'#eef2f7'}}>
          <div style={{background:'#fff',borderRadius:14,padding:'40px 38px',minWidth:340,boxShadow:'0 12px 48px rgba(4,45,89,.18)'}}>
            <div style={{textAlign:'center',marginBottom:28}}>
              <div style={{width:60,height:60,background:'#042D59',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 14px',fontSize:'1.6rem'}}>🏢</div>
              <div style={{fontSize:'1.25rem',fontWeight:700,color:'#042D59'}}>Dashboard Operativo</div>
              <div style={{fontSize:'.85rem',color:'#64748b',marginTop:4}}>Acceso restringido — solo usuarios autorizados</div>
            </div>
            <form onSubmit={doLogin} style={{display:'flex',flexDirection:'column',gap:12}}>
              <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="Correo electrónico" required autoFocus
                style={{border:'1px solid #c8d8ec',borderRadius:6,padding:'10px 13px',fontSize:'1rem',color:'#1e293b',outline:'none',fontFamily:'inherit'}}/>
              <input type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="Contraseña" required
                style={{border:'1px solid #c8d8ec',borderRadius:6,padding:'10px 13px',fontSize:'1rem',color:'#1e293b',outline:'none',fontFamily:'inherit'}}/>
              {err&&<div style={{color:'#dc2626',fontSize:'.875rem',textAlign:'center'}}>{err}</div>}
              <button type="submit" disabled={loading}
                style={{background:'#042D59',color:'#fff',border:'none',borderRadius:7,padding:'11px',fontSize:'1rem',fontWeight:600,cursor:'pointer',marginTop:4,opacity:loading?.7:1}}>
                {loading?'Ingresando...':'Ingresar'}
              </button>
            </form>
            <p style={{color:'#94a3b8',fontSize:'.75rem',textAlign:'center',marginTop:20,lineHeight:1.5}}>
              Para obtener acceso, contacta al administrador.
            </p>
          </div>
        </div>
      );
    }


    // ── Root (maneja autenticación) ─────────────────────────────────────────
    function Root(){
      const[user,setUser]=useState(undefined);
      useEffect(()=>firebase.auth().onAuthStateChanged(u=>setUser(u||null)),[]);
      if(user===undefined)return(
        <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',background:'#eef2f7'}}>
          <span style={{color:'#64748b',fontSize:'1rem'}}>Verificando sesión...</span>
        </div>
      );
      if(!user)return <LoginScreen/>;
      return(
        <AuthCtx.Provider value={user}>
          <StoreProvider>
            <App/>
          </StoreProvider>
        </AuthCtx.Provider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
  </script>
</body>
